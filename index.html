const slides=[{"title": "Le monotype : atelier de création et d’impression", "body": "Œuvres originales réalisées par les élèves de l’École Rounaki, à Souleimaniye, au Kurdistan d’Irak. Âge : 8 à 12 ans. Conception et encadrement pédagogique : Soran Ahmed, enseignant en arts plastiques. Cet atelier est consacré exclusivement au monotype, une technique d’impression artistique.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Découvrir le monotype", "body": "Le monotype consiste à peindre une composition sur une plaque lisse, puis à transférer l’image sur une feuille de papier par pression. Le résultat est une estampe unique, caractérisée par des traces de pinceau, des textures et des variations de couleurs. Les élèves explorent librement les formes et les contrastes.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Matériel utilisé", "body": "Peintures à l’huile ou encres grasses d’imprimerie ; médium compatible pour assouplir la peinture ; petits pots en verre ; pinceaux ; papier pour l’impression ; et plaques métalliques lisses récupérées de l’imprimerie. Dans cet atelier, j’ai réutilisé des plaques d’impression destinées à être jetées après usage.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Préparer les couleurs avant la séance", "body": "L’enseignant prépare chaque couleur séparément dans un petit pot en verre, avec une quantité adaptée de médium pour peinture à l’huile afin d’obtenir la fluidité souhaitée. Les élèves ne mélangent pas les couleurs à l’intérieur des pots : cela évite de salir ou de contaminer les réserves de peinture. Le médium est choisi selon les indications du fabricant.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Organiser la classe en petits groupes", "body": "La classe est répartie en plusieurs groupes. Chaque groupe dispose de ses propres couleurs, pinceaux, pots et plaque d’impression. Avant de commencer, l’enseignant explique les règles de partage du matériel, de propreté et de respect de l’espace de travail.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Montrer la technique aux enfants", "body": "Avant le travail autonome, l’enseignant réalise plusieurs démonstrations devant les élèves. Il peut aussi projeter une vidéo pédagogique, notamment celle présentée sur cette page, pour rendre les gestes plus faciles à comprendre. Les enfants observent la préparation, l’application des couleurs et le transfert sur papier.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Peindre sur la plaque d’impression", "body": "À l’aide des pinceaux, les élèves composent directement leur image colorée sur la plaque métallique lisse. Ils expérimentent les mouvements du pinceau, les surfaces, les superpositions et les contrastes. Ils utilisent les couleurs mises à disposition sans mélanger le contenu des petits pots.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Imprimer l’image sur le papier", "body": "Une fois la composition terminée sur la plaque, une feuille propre est posée avec précaution sur la peinture. Une pression douce et régulière permet le transfert. La feuille est ensuite soulevée délicatement : l’image imprimée apparaît. L’enseignant accompagne les enfants pour préserver la qualité du tirage et garder la table propre.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Propreté, sécurité et rangement", "body": "La propreté des mains, des outils, des pots, des plaques et de l’espace de travail fait partie de l’apprentissage. L’enseignant supervise les produits et leur manipulation. Pour reproduire cette activité avec des enfants, il est recommandé de privilégier des encres de monotype à base d’eau, adaptées à l’âge des élèves, et d’éviter les solvants pétroliers. Les plaques récupérées doivent être vérifiées et leurs bords rendus sûrs.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Laisser sécher les œuvres", "body": "Les impressions terminées sont déposées ou affichées dans un espace réservé, sans contact entre les surfaces peintes. Elles restent en place jusqu’au lendemain ou plus longtemps si nécessaire, selon les matériaux employés, afin de sécher suffisamment. Les outils et le poste de travail sont ensuite nettoyés et rangés.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Objectifs pédagogiques et galerie", "body": "Cet atelier développe la créativité, l’autonomie, la coordination du geste, la coopération en groupe et la compréhension de l’impression. Les 103 œuvres qui suivent ont été réalisées par les élèves de l’École Rounaki, âgés de 8 à 12 ans. La présentation se poursuit maintenant en images, accompagnées uniquement de musique. Portfolio : www.wowindesign.com.", "img": "artwork_014.jpg", "kind": "intro"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 1 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_001.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 2 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_002.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 3 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_003.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 4 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_004.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 5 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_005.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 6 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_006.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 7 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 ans.", "img": "artwork_007.jpg", "kind": "gallery"}, {"title": "Galerie des élèves · Monotype", "body": "Œuvre 8 sur 103 · École Rounaki · Souleimaniye, Irak · 8 à 12 let index=0,playing=false,voice=false,timer=null,utterance=null,serial=0,enteredGallery=false;
const el=id=>document.getElementById(id), music=el('music');
const introCount=11;
function stopVoice(){if('speechSynthesis' in window)speechSynthesis.cancel();utterance=null}
function setMusic(){if(index>=introCount){stopVoice();music.play().catch(()=>{el('audiohint').textContent='Cliquez sur « Activer le son » pour écouter la musique.'})}else{music.pause();music.currentTime=0}}
function next(){index=(index+1)%slides.length;render()}
function schedule(){clearTimeout(timer);if(!playing)return;
 if(index>=introCount || !voice || !('speechSynthesis' in window))timer=setTimeout(next,index>=introCount?Number(el('speed').value):22000);
}
function speak(){if(!playing||!voice||index>=introCount||!('speechSynthesis' in window))return;
 stopVoice();const token=++serial, u=new SpeechSynthesisUtterance(slides[index].title+'. '+slides[index].body);utterance=u;u.lang='fr-FR';u.rate=.91;
 const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;
 u.onend=()=>{if(token===serial&&playing&&index<introCount)next()};
 u.onerror=()=>{if(token===serial&&playing&&index<introCount){clearTimeout(timer);timer=setTimeout(next,18000)}};
 speechSynthesis.speak(u);
}
function render(){++serial;clearTimeout(timer);stopVoice();let s=slides[index];el('title').textContent=s.title;el('body').textContent=s.body;el('image').src=s.img;
 el('count').textContent=index<introCount?'Présentation · '+(index+1)+' / '+introCount:'Œuvre '+(index-introCount+1)+' / 103';
 el('screen').classList.toggle('gallery',index>=introCount);setMusic();if(playing&&index<introCount&&voice)speak();schedule();
}
function play(){playing=!playing;el('play').textContent=playing?'⏸ Pause':'▶ Lecture';if(playing){if(index>=introCount)music.play().catch(()=>{});else speak()}else{stopVoice();music.pause()}schedule()}
el('prev').onclick=()=>{index=(index-1+slides.length)%slides.length;render()};el('next').onclick=next;
el('play').onclick=play;el('speed').onchange=schedule;
